plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "maven.modrinth:sway:${sway_version}"
    implementation "maven.modrinth:project-atmosphere:${project_atmosphere_version}"
    compileOnly "maven.modrinth:simple-clouds:${simple_clouds_version}"

    // Modrinth Maven does not publish transitive metadata. These make the
    // development client match Project Atmosphere's documented runtime stack.
    runtimeOnly 'curse.maven:gabous-libs-1367332:8376871'
    runtimeOnly 'curse.maven:simple-clouds-1121215:6928979'
    runtimeOnly 'curse.maven:serene-seasons-291874:6182596'
    runtimeOnly 'curse.maven:glitchcore-955399:5660740'
    runtimeOnly 'curse.maven:architectury-api-419699:5786327'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def metadataProperties = [
        minecraft_version: minecraft_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_group_id: mod_group_id,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description
]

tasks.named('processResources', ProcessResources) {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
}
