name: Pull Request Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: enhanced
          cache-read-only: false
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build --build-cache --no-daemon --stacktrace -PskipDevelopmentRuntime=true

      - name: Validate release metadata and artifact name
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          expected_jar="build/libs/atmossway-${mod_version}-NEO-${minecraft_version}.jar"

          python3 scripts/validate_modrinth_release.py \
            --manifest .github/modrinth-dependencies.json \
            --expected-version "${mod_version}" \
            --game-version "${minecraft_version}"
          python3 -m unittest discover -s scripts/tests -v

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          if [[ "${#jars[@]}" -ne 1 || "${jars[0]}" != "${expected_jar}" ]]; then
            echo "Expected only ${expected_jar}; found: ${jars[*]:-none}" >&2
            exit 1
          fi
