name: Publish Release

on:
  push:
    tags:
      - "v*-NEO-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: enhanced
          cache-read-only: false
          validate-wrappers: true

      - name: Validate release tag and metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          property() {
            sed -n "s/^$1=//p" gradle.properties | tail -n 1 | tr -d '\r'
          }

          mod_version="$(property mod_version)"
          minecraft_version="$(property minecraft_version)"
          expected_tag="v${mod_version}-NEO-${minecraft_version}"
          jar_name="atmossway-${mod_version}-NEO-${minecraft_version}.jar"
          jar_path="build/libs/${jar_name}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected release tag ${expected_tag}, received ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in origin/main" >&2
            exit 1
          fi

          python3 scripts/validate_modrinth_release.py \
            --manifest .github/modrinth-dependencies.json \
            --expected-version "${mod_version}" \
            --game-version "${minecraft_version}"
          python3 -m unittest discover -s scripts/tests -v

          {
            echo "mod_version=${mod_version}"
            echo "minecraft_version=${minecraft_version}"
            echo "jar_name=${jar_name}"
            echo "jar_path=${jar_path}"
            echo "display_name=Atmospheric Wind Sway ${mod_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: ./gradlew clean build --build-cache --no-daemon --stacktrace -PskipDevelopmentRuntime=true

      - name: Verify release artifact
        id: artifact
        shell: bash
        env:
          EXPECTED_JAR: ${{ steps.metadata.outputs.jar_path }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          if [[ "${#jars[@]}" -ne 1 || "${jars[0]}" != "${EXPECTED_JAR}" ]]; then
            echo "Expected only ${EXPECTED_JAR}; found: ${jars[*]:-none}" >&2
            exit 1
          fi
          digest="$(sha256sum "${EXPECTED_JAR}" | cut -d ' ' -f 1)"
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${EXPECTED_JAR} (SHA-256 ${digest})"

      - name: Create or verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          JAR_NAME: ${{ steps.metadata.outputs.jar_name }}
          JAR_PATH: ${{ steps.metadata.outputs.jar_path }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq "${JAR_NAME}"; then
              existing_dir="${RUNNER_TEMP}/existing-release"
              mkdir -p "${existing_dir}"
              gh release download "${TAG}" --pattern "${JAR_NAME}" --dir "${existing_dir}"
              existing_sha256="$(sha256sum "${existing_dir}/${JAR_NAME}" | cut -d ' ' -f 1)"
              if [[ "${existing_sha256}" != "${EXPECTED_SHA256}" ]]; then
                echo "GitHub Release already contains a conflicting ${JAR_NAME}" >&2
                exit 1
              fi
              echo "GitHub Release already contains the matching jar"
            else
              gh release upload "${TAG}" "${JAR_PATH}"
            fi
          else
            gh release create "${TAG}" "${JAR_PATH}" \
              --verify-tag \
              --generate-notes \
              --title "${TAG}"
          fi

          gh release view "${TAG}" --json body --jq '.body' > build/release-notes.md

      - name: Validate Modrinth project and release
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 scripts/validate_modrinth_release.py \
            --manifest .github/modrinth-dependencies.json \
            --expected-version "${{ steps.metadata.outputs.mod_version }}" \
            --game-version "${{ steps.metadata.outputs.minecraft_version }}" \
            --artifact "${{ steps.metadata.outputs.jar_path }}" \
            --display-name "${{ steps.metadata.outputs.display_name }}" \
            --online

      - name: Publish Modrinth release
        if: steps.modrinth.outputs.publish == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: m4ChLkSm
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: ${{ steps.metadata.outputs.jar_path }}
          modrinth-name: ${{ steps.metadata.outputs.display_name }}
          modrinth-version: ${{ steps.metadata.outputs.mod_version }}
          modrinth-version-type: release
          modrinth-changelog-file: build/release-notes.md
          modrinth-loaders: neoforge
          modrinth-game-versions: ${{ steps.metadata.outputs.minecraft_version }}
          modrinth-game-version-filter: none
          modrinth-dependencies: ${{ steps.modrinth.outputs.dependencies }}
          modrinth-java: 21
          modrinth-retry-attempts: 3
          modrinth-retry-delay: 10000
          modrinth-fail-mode: fail

      - name: Verify Modrinth publication
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 scripts/validate_modrinth_release.py \
            --manifest .github/modrinth-dependencies.json \
            --expected-version "${{ steps.metadata.outputs.mod_version }}" \
            --game-version "${{ steps.metadata.outputs.minecraft_version }}" \
            --artifact "${{ steps.metadata.outputs.jar_path }}" \
            --display-name "${{ steps.metadata.outputs.display_name }}" \
            --online \
            --expect-existing
